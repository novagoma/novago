<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVAGO — Les tendances à portée de main</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF6A00; --orange-dark:#E25A00; --navy:#0D1B2A; --navy-soft:#152539;
  --white:#FFFFFF; --grey:#F2F2F2; --grey-line:#e3e3e3; --text-soft:#5b6572; --radius:14px;
  --green:#1f9d55; --red:#d64545; --blue:#3556d1;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:'Open Sans',sans-serif;color:var(--navy);background:#fff;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
img{max-width:100%;display:block;}
.container{max-width:1240px;margin:0 auto;padding:0 24px;}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;}
table{border-collapse:collapse;width:100%;}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--grey-line);}
.nav-row{display:flex;align-items:center;gap:22px;padding:14px 0;flex-wrap:wrap;}
.logo{font-family:'Poppins';font-weight:900;font-size:22px;color:var(--navy);cursor:pointer;}
.logo span{color:var(--orange);}
nav.main-nav{display:flex;gap:20px;flex:1;flex-wrap:wrap;}
nav.main-nav a{font-weight:700;font-size:14px;padding:6px 0;cursor:pointer;}
nav.main-nav a:hover, nav.main-nav a.active{color:var(--orange);}
.nav-icons{display:flex;align-items:center;gap:10px;}
.icon-btn{position:relative;height:38px;border-radius:999px;background:var(--grey);display:flex;align-items:center;justify-content:center;padding:0 16px;gap:6px;font-weight:700;font-size:13px;}
.icon-btn:hover{background:#e9e9e9;}
.badge{position:absolute;top:-6px;right:-6px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .18s,box-shadow .18s,background .2s;}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 10px 24px -8px rgba(255,106,0,.5);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-outline{background:#fff;border:1.5px solid var(--navy);color:var(--navy);}
.btn-outline:hover{background:var(--navy);color:#fff;}
.btn-danger{background:#fdeceb;color:var(--red);font-weight:700;}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-green{background:#e7f6ec;color:var(--green);font-weight:700;}
.btn-green:hover{background:var(--green);color:#fff;}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:999px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.view{display:none;}
.view.active{display:block;}

.hero{background:var(--navy);color:#fff;padding:60px 0;}
.hero .container{display:flex;align-items:center;gap:50px;flex-wrap:wrap;}
.hero-copy{flex:1;min-width:280px;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,106,0,.14);color:var(--orange);font-weight:700;font-size:12.5px;letter-spacing:.06em;padding:7px 14px;border-radius:999px;margin-bottom:20px;}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.1;font-weight:800;margin:0 0 16px;}
.hero h1 .go{color:var(--orange);}
.hero p{font-size:16px;color:#b8c4d1;max-width:440px;line-height:1.6;margin:0 0 26px;}
.hero-visual{flex:1;min-width:240px;display:flex;justify-content:center;}
.hero-card{background:#fff;color:var(--navy);border-radius:18px;padding:22px;width:230px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);transform:rotate(-3deg);}
.hero-card .ph{height:100px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:34px;}
.hero-card .price{color:var(--orange);font-weight:800;font-size:17px;}

.section{padding:44px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.section-head h2{font-size:23px;margin:0 0 6px;font-weight:800;}
.section-head p{margin:0;color:var(--text-soft);font-size:14px;}

.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.cat-card{background:var(--grey);border-radius:var(--radius);padding:20px 14px;text-align:center;border:2px solid transparent;}
.cat-card:hover{background:#ececec;}
.cat-card.active{border-color:var(--orange);background:#fff4ea;}
.cat-ico{font-size:24px;margin-bottom:8px;}
.cat-card span{display:block;font-weight:700;font-size:13px;}

.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.chip{padding:9px 17px;border-radius:999px;background:var(--grey);font-weight:600;font-size:13px;}
.chip.active{background:var(--navy);color:#fff;}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.pcard{border:1px solid var(--grey-line);border-radius:var(--radius);overflow:hidden;background:#fff;display:flex;flex-direction:column;}
.pcard:hover{box-shadow:0 18px 34px -18px rgba(13,27,42,.28);}
.pimg{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:56px;}
.pimg .fav{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:15px;}
.promo-flag{position:absolute;top:10px;left:10px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:6px;}
.pinfo{padding:14px 15px 16px;display:flex;flex-direction:column;gap:7px;flex:1;}
.pcat{font-size:10.5px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.04em;}
.pname{font-size:14.5px;font-weight:700;line-height:1.35;min-height:38px;cursor:pointer;}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
.price-wrap{display:flex;align-items:baseline;gap:7px;}
.price{font-family:'Poppins';font-weight:800;font-size:17px;}
.old-price{font-size:12px;color:#a3adb8;text-decoration:line-through;}
.add-btn{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;}
.add-btn:hover{background:var(--orange);}
.empty-state{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-soft);}

.pdp-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:30px 0 60px;align-items:flex-start;}
.gallery-main{aspect-ratio:1/1;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:110px;}
.pdp-info h1{font-size:25px;margin:0 0 10px;font-weight:800;}
.pdp-price{display:flex;align-items:baseline;gap:12px;margin:16px 0 6px;}
.pdp-price .now{font-family:'Poppins';font-weight:800;font-size:27px;}
.pdp-price .old{font-size:15px;color:#a3adb8;text-decoration:line-through;}
.stock-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--green);font-weight:600;margin:14px 0 20px;}
.qty-select{display:flex;align-items:center;gap:14px;background:var(--grey);border-radius:999px;padding:8px;width:130px;justify-content:space-between;margin-bottom:20px;}
.qty-select button{width:26px;height:26px;border-radius:50%;background:#fff;font-weight:700;}
.action-row{display:flex;gap:12px;flex-wrap:wrap;}
.pdp-desc{margin-top:22px;color:#33404d;font-size:14.5px;line-height:1.7;max-width:480px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--text-soft);margin:20px 0 0;cursor:pointer;}
.back-link:hover{color:var(--orange);}

.form-card{max-width:440px;margin:50px auto;background:#fff;border:1px solid var(--grey-line);border-radius:var(--radius);padding:34px;}
.form-card h2{margin:0 0 6px;font-size:22px;}
.form-card .sub{color:var(--text-soft);font-size:13.5px;margin-bottom:22px;}
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 14px;border:1.5px solid var(--grey-line);border-radius:10px;font-size:14px;font-family:inherit;outline:none;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--orange);}
.form-toggle{display:flex;gap:8px;margin-bottom:22px;background:var(--grey);padding:5px;border-radius:999px;}
.form-toggle button{flex:1;padding:10px;border-radius:999px;font-weight:700;font-size:13.5px;}
.form-toggle button.active{background:var(--navy);color:#fff;}
.err-msg{color:var(--red);font-size:13px;margin-top:-8px;margin-bottom:14px;display:none;}
.hint{font-size:11.5px;color:var(--text-soft);margin-top:5px;}

.acc-hero{background:var(--navy);color:#fff;padding:34px 0;}
.acc-hero .container{display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap;}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:800;font-size:18px;}
.acc-id{display:flex;align-items:center;gap:16px;}
.acc-id h1{margin:0 0 4px;font-size:18px;}
.acc-id span{color:#9fb0c0;font-size:13px;}
.acc-grid{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:flex-start;padding:32px 0 70px;}
.side-nav{background:#fff;border:1px solid var(--grey-line);border-radius:var(--radius);padding:10px;}
.side-item{display:block;padding:11px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;}
.side-item:hover{background:var(--grey);}
.side-item.active{background:#fff4ea;color:var(--orange);}
.acc-panel{display:none;}
.acc-panel.active{display:block;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
.stat-card{background:var(--grey);border-radius:var(--radius);padding:18px;text-align:center;}
.stat-card b{display:block;font-size:20px;font-family:'Poppins';}
.order-card{border:1px solid var(--grey-line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.order-top{display:flex;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.order-ref{font-weight:800;font-size:14px;}
.order-date{color:var(--text-soft);font-size:12px;}
.status{padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;}
.status.en_attente{background:#fff4ea;color:var(--orange);}
.status.confirmee{background:#e7f6ec;color:var(--green);}
.status.annulee{background:#fdeceb;color:var(--red);}
.order-foot{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:10px;}
.empty-note{color:var(--text-soft);font-size:13.5px;padding:20px;text-align:center;background:var(--grey);border-radius:var(--radius);}

.aff-hero{background:linear-gradient(135deg,var(--navy),#1e3b57);color:#fff;padding:60px 0;text-align:center;}
.aff-hero h1{font-size:32px;margin:0 0 14px;}
.aff-hero p{max-width:560px;margin:0 auto 24px;color:#b8c4d1;}
.aff-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:640px;margin:0 auto;}
.aff-stats div{background:rgba(255,255,255,.08);border-radius:14px;padding:16px;}
.aff-stats b{display:block;font-size:22px;font-family:'Poppins';color:var(--orange);}
.aff-code-box{background:var(--grey);border-radius:var(--radius);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.aff-code{font-family:'Poppins';font-weight:800;font-size:18px;letter-spacing:.05em;color:var(--navy);}

.cart-row{display:grid;grid-template-columns:60px 1fr auto auto auto;gap:14px;align-items:center;border-bottom:1px solid var(--grey-line);padding:14px 0;}
.cart-row .em{font-size:34px;}
.cart-name{font-weight:700;font-size:14px;}
.cart-cat{font-size:11.5px;color:var(--text-soft);}
.qty-mini{display:flex;align-items:center;gap:8px;background:var(--grey);border-radius:999px;padding:5px;}
.qty-mini button{width:24px;height:24px;border-radius:50%;background:#fff;font-weight:700;}
.cart-total-box{background:var(--grey);border-radius:var(--radius);padding:22px;}
.cart-total-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;}
.cart-total-row.grand{font-weight:800;font-size:17px;border-top:1px solid var(--grey-line);padding-top:12px;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:14px 24px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

footer{background:var(--navy);color:#9fb0c0;padding:30px 0;text-align:center;font-size:12.5px;margin-top:40px;}
footer a{text-decoration:underline;cursor:pointer;}

/* Admin shell */
.admin-shell{display:none;grid-template-columns:230px 1fr;min-height:100vh;background:#f5f6f8;}
.admin-shell.active{display:grid;}
.sidebar{background:var(--navy);color:#cfd8e3;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.side-logo{font-family:'Poppins';font-weight:900;font-size:19px;color:#fff;padding:8px 10px 22px;}
.side-logo span{color:var(--orange);}
.admin-link{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;margin-bottom:3px;color:#cfd8e3;}
.admin-link.active{background:rgba(255,106,0,.16);color:#fff;}
.admin-link:hover:not(.active){background:rgba(255,255,255,.06);}
.admin-main{padding:0;}
.admin-topbar{background:#fff;border-bottom:1px solid var(--grey-line);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;}
.admin-topbar h1{font-size:19px;margin:0;font-weight:800;}
.admin-content{padding:24px 28px 60px;}
.admin-panel{display:none;}
.admin-panel.active{display:block;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:#fff;border:1px solid var(--grey-line);border-radius:var(--radius);padding:18px 20px;}
.kpi-card .lbl{font-size:12px;color:var(--text-soft);font-weight:600;margin-bottom:6px;}
.kpi-card b{font-size:24px;font-family:'Poppins';}
.panel-box{background:#fff;border:1px solid var(--grey-line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
.panel-box h3{margin:0 0 16px;font-size:16px;}
.admin-form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.admin-form-grid input,.admin-form-grid select,.admin-form-grid textarea{padding:10px 12px;border:1.5px solid var(--grey-line);border-radius:8px;font-size:13.5px;font-family:inherit;}
.data-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-soft);padding:10px 8px;border-bottom:2px solid var(--grey-line);}
.data-table td{padding:12px 8px;border-bottom:1px solid var(--grey-line);font-size:13.5px;vertical-align:middle;}
.pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;}
.pill.admin{background:#e6ecff;color:var(--blue);}
.pill.client{background:var(--grey);color:var(--navy);}
.act-btns{display:flex;gap:6px;}

@media(max-width:900px){
  .cat-grid{grid-template-columns:repeat(3,1fr);}
  .product-grid{grid-template-columns:repeat(2,1fr);}
  .pdp-grid{grid-template-columns:1fr;}
  .acc-grid{grid-template-columns:1fr;}
  .admin-shell.active{grid-template-columns:1fr;}
  .sidebar{position:static;height:auto;}
  nav.main-nav{order:3;width:100%;}
}
</style>
</head>
<body>

<header id="siteHeader">
  <div class="container nav-row">
    <div class="logo" onclick="goTo('home')">NOVA<span>GO</span></div>
    <nav class="main-nav">
      <a onclick="goTo('home')" data-nav="home">Accueil</a>
      <a onclick="goTo('catalog')" data-nav="catalog">Catalogue</a>
      <a onclick="goTo('affiliation')" data-nav="affiliation">Affiliation</a>

</header>

<main id="app"></main>

<div class="admin-shell" id="adminShell">
  <aside class="sidebar">
    <div class="side-logo">NOVA<span>GO</span> · Admin</div>
    <a class="admin-link" data-tab="dashboard" onclick="goAdminTab('dashboard')">📊 Tableau de bord</a>
    <a class="admin-link" data-tab="users" onclick="goAdminTab('users')">👥 Utilisateurs</a>
    <a class="admin-link" data-tab="products" onclick="goAdminTab('products')">📦 Produits</a>
    <a class="admin-link" data-tab="orders" onclick="goAdminTab('orders')">🧾 Commandes</a>
    <a class="admin-link" data-tab="affiliates" onclick="goAdminTab('affiliates')">🔗 Affiliation</a>
    <a class="admin-link" style="margin-top:20px;color:#ff8a6a" onclick="adminLogout()">🚪 Quitter l'admin</a>
    <a class="admin-link" style="color:#8fa0b3" onclick="goTo('home')">← Retour au site</a>
  </aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <h1 id="adminTitle">Tableau de bord</h1>
      <div class="admin-avatar" style="width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;">AD</div>
    </div>
    <div class="admin-content">
      <div class="admin-panel active" id="panel-dashboard"></div>
      <div class="admin-panel" id="panel-users"></div>
      <div class="admin-panel" id="panel-products"></div>
      <div class="admin-panel" id="panel-orders"></div>
      <div class="admin-panel" id="panel-order-detail"></div>
      <div class="admin-panel" id="panel-affiliates"></div>
    </div>
  </div>
</div>

<footer id="siteFooter">
  <div class="container">
    NOVAGO © 2026 — Les tendances à portée de main · <a onclick="goTo('adminlogin')">Espace administrateur</a>
  </div>
</footer>

<script>
/* ============================================================
   STORAGE HELPERS (persistent, shared across all users of the site)
   ============================================================ */
async function sGet(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
  catch(e){ console.error('storage error', e); return false; }
}

const CATS = [
  {id:'electronique', label:'Électronique', emoji:'🎧', grad:['#0d1b2a','#3d5a76']},
  {id:'mode', label:'Mode', emoji:'👗', grad:['#7a2e6e','#c2568f']},
  {id:'maison', label:'Maison', emoji:'🛋️', grad:['#2e6e4f','#5cb37f']},
  {id:'beaute', label:'Beauté', emoji:'💄', grad:['#a13a3a','#e0716b']},
  {id:'sport', label:'Sport', emoji:'⚽', grad:['#1f5a8c','#4fa0d9']},
];
function catOf(id){ return CATS.find(c=>c.id===id) || CATS[0]; }

const MOROCCO_CITIES = [
  'Agadir','Al Hoceïma','Assilah','Azemmour','Azrou','Béni Mellal','Benguerir','Berkane','Berrechid',
  'Boujdour','Bouznika','Casablanca','Chefchaouen','Dakhla','Demnate','El Jadida','El Kelaâ des Sraghna',
  'Errachidia','Essaouira','Fès','Fkih Ben Salah','Guelmim','Guercif','Ifrane','Imzouren','Inezgane',
  'Kénitra','Khemisset','Khénifra','Khouribga','Ksar El Kébir','Laâyoune','Larache','Marrakech','Martil',
  'Meknès','Midelt','Mohammédia','Nador','Ouarzazate','Ouazzane','Oued Zem','Oujda','Rabat','Safi','Salé',
  'Sefrou','Settat','Sidi Bennour','Sidi Ifni','Sidi Kacem','Sidi Slimane','Skhirat','Smara','Tan-Tan',
  'Tanger','Taounate','Taourirt','Taroudant','Taza','Témara','Tétouan','Tiflet','Tiznit','Youssoufia'
].sort((a,b)=>a.localeCompare(b,'fr'));

function cityOptionsHTML(selected){
  return `<option value="">Sélectionner une ville</option>` +
    MOROCCO_CITIES.map(c=>`<option value="${c}" ${selected===c?'selected':''}>${c}</option>`).join('');
}

/* ============================================================
   IMAGE HELPERS (photo upload -> compressed data URL)
   ============================================================ */
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleProductPhotosChange(input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  for(const file of files){
    if(!file.type.startsWith('image/')) continue;
    try{
      const dataUrl = await compressImageFile(file, 700, 0.82);
      state.productPhotosDraft.push(dataUrl);
    }catch(err){ showToast("Impossible de charger une image"); }
  }
  input.value = '';
  renderPhotoDraftPreview();
}
function removeDraftPhoto(index){
  state.productPhotosDraft.splice(index, 1);
  renderPhotoDraftPreview();
}
function renderPhotoDraftPreview(){
  const wrap = document.getElementById('photoDraftWrap');
  if(!wrap) return;
  wrap.innerHTML = state.productPhotosDraft.map((src,i)=>`
    <div style="position:relative;width:90px;height:90px;">
      <img src="${src}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--grey-line);">
      <button type="button" onclick="removeDraftPhoto(${i})" style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;">✕</button>

    </div>`).join('');
}

/* ============================================================

   ============================================================ */
async function seedIfNeeded(){
  let users = await sGet('novago:users', true);
  if(!users){
    users = [{
      id:'admin_root', fullName:'Administrateur NOVAGO', email:ADMIN_EMAIL, sexe:'',
      password:ADMIN_PASSWORD, role:'admin', createdAt: new Date().toISOString().slice(0,10)
    }];
    await sSet('novago:users', users, true);
  } else if(!users.find(u=>u.email===ADMIN_EMAIL)){
    users.push({id:'admin_root', fullName:'Administrateur NOVAGO', email:ADMIN_EMAIL, sexe:'', password:ADMIN_PASSWORD, role:'admin', createdAt:new Date().toISOString().slice(0,10)});
    await sSet('novago:users', users, true);
  }
  state.users = users;

  let products = await sGet('novago:products', true);
  if(!products){ products = DEFAULT_PRODUCTS; await sSet('novago:products', products, true); }
  state.products = products;

  let orders = await sGet('novago:orders', true);
  if(!orders){ orders = []; await sSet('novago:orders', orders, true); }
  state.orders = orders;

  let affiliates = await sGet('novago:affiliates', true);
  if(!affiliates){ affiliates = []; await sSet('novago:affiliates', affiliates, true); }
  state.affiliates = affiliates;

  const session = await sGet('novago:session', false);
  state.session = session || null;

  const cart = await sGet('novago:cart', false);
  state.cart = cart || [];

  const adminSession = await sGet('novago:adminSession', false);
  state.adminSession = !!adminSession;
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function goTo(view, params){
  params = params || {};
  state.view = view;
  document.getElementById('siteHeader').style.display = 'block';
  document.getElementById('siteFooter').style.display = 'block';
  document.getElementById('adminShell').classList.remove('active');
  document.getElementById('app').style.display = 'block';

  if(view === 'product') state.currentProductId = params.productId;

  const renderers = {
    home: renderHome, catalog: renderCatalog, product: renderProduct,
    cart: renderCart, login: renderAuth, account: renderAccount,
    affiliation: renderAffiliation, adminlogin: renderAdminLogin,
  };
  if(view === 'account' && !currentUser()){ state.authMode='login'; view='login'; }
  (renderers[view] || renderHome)();
  updateHeader();
  window.scrollTo({top:0, behavior:'smooth'});
}

function pImages(p){
  if(p.images && p.images.length) return p.images;
  if(p.image) return [p.image];
  return [];
}
function pMainImage(p){ const imgs = pImages(p); return imgs.length ? imgs[0] : null; }
function pVisualStyle(p){
  const c = catOf(p.cat);
  const img = pMainImage(p);
  return img ? `background-image:url('${img}');background-size:cover;background-position:center;` : `background:linear-gradient(135deg,${c.grad[0]},${c.grad[1]});`;
}
function pVisualContent(p){ return pMainImage(p) ? '' : p.emoji; }

function productCardHTML(p){
  const c = catOf(p.cat);
  const isFav = false;
  return `<div class="pcard">
    <div class="pimg" style="${pVisualStyle(p)}" data-open="${p.id}">
      ${p.oldPrice>0?`<span class="promo-flag">PROMO</span>`:''}
      <span class="fav">♡</span>${pVisualContent(p)}
    </div>
    <div class="pinfo">
      <span class="pcat">${c.label}</span>
      <span class="pname" data-open="${p.id}">${p.name}</span>
      <div class="price-row">
        <div class="price-wrap"><span class="price">${money(p.price)}</span>${p.oldPrice>0?`<span class="old-price">${money(p.oldPrice)}</span>`:''}</div>
        <button class="add-btn" data-add="${p.id}">+</button>
      </div>
    </div>
  </div>`;
}
function attachProductCardEvents(){

/* ============================================================
   CART
   ============================================================ */
async function addToCart(productId, qty){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const existing = state.cart.find(i=>i.productId===productId);
  if(existing) existing.qty += qty; else state.cart.push({productId, qty});
  await persistCart();
  updateHeader();
  showToast(p.name + ' ajouté au panier');
}
async function setQty(productId, qty){
  const it = state.cart.find(i=>i.productId===productId);
  if(!it) return;
  if(qty<=0){ state.cart = state.cart.filter(i=>i.productId!==productId); }
  else it.qty = qty;
  await persistCart();
  renderCart(); updateHeader();
}
function renderCart(){
  const rows = state.cart.map(i=>{
    const p = state.products.find(x=>x.id===i.productId);
    if(!p) return '';
    const c = catOf(p.cat);
    return `<div class="cart-row">
      <div class="em" style="${pVisualStyle(p)}width:60px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;">${pVisualContent(p)}</div>
      <div><div class="cart-name">${p.name}</div><div class="cart-cat">${c.label}</div></div>
      <div class="qty-mini"><button data-dec="${p.id}">−</button><span>${i.qty}</span><button data-inc="${p.id}">+</button></div>
      <div style="font-weight:800;">${money(p.price*i.qty)}</div>
      <button class="btn-sm btn-danger" data-remove="${p.id}">Retirer</button>
    </div>`;
  }).join('');
  const total = state.cart.reduce((s,i)=>{ const p=state.products.find(x=>x.id===i.productId); return s + (p?p.price*i.qty:0); },0);
  document.getElementById('app').innerHTML = `
  <section class="section container">
    <div class="section-head"><h2>Mon panier</h2></div>
    ${state.cart.length===0 ? `<div class="empty-state">Votre panier est vide. <br><button class="btn btn-primary" style="margin-top:14px;" onclick="goTo('catalog')">Voir le catalogue</button></div>` : `
    <div style="display:grid;grid-template-columns:1fr 320px;gap:30px;align-items:flex-start;">
      <div>${rows}</div>
      <div class="cart-total-box">
        <div class="cart-total-row"><span>Sous-total</span><span>${money(total)}</span></div>
        <div class="cart-total-row"><span>Livraison</span><span>Gratuite</span></div>
        <div class="cart-total-row grand"><span>Total</span><span>${money(total)}</span></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:14px;" id="checkoutBtn">Passer la commande</button>
      </div>
    </div>`}
  </section>`;
  document.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>{ const it=state.cart.find(i=>i.productId==b.dataset.inc); setQty(Number(b.dataset.inc), it.qty+1); }));
  document.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>{ const it=state.cart.find(i=>i.productId==b.dataset.dec); setQty(Number(b.dataset.dec), it.qty-1); }));
  document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>setQty(Number(b.dataset.remove), 0)));
  const co = document.getElementById('checkoutBtn');
  if(co) co.addEventListener('click', placeOrder);
}

async function placeOrder(){
  const u = currentUser();
  if(!u){ showToast('Connectez-vous pour valider votre commande'); goTo('login'); return; }
  if(state.cart.length===0) return;
  if(!u.address || !u.phone){
    showToast('Veuillez renseigner votre adresse et téléphone de livraison avant de commander');
    goTo('account');
    setTimeout(()=>{
      document.querySelectorAll('.side-item').forEach(i=>i.classList.remove('active'));
      document.querySelectorAll('.acc-panel').forEach(p=>p.classList.remove('active'));
      const navItem = document.querySelector('.side-item[data-panel="profile"]');
      const panel = document.querySelector('.acc-panel[data-panel="profile"]');
      if(navItem && panel){ navItem.classList.add('active'); panel.classList.add('active'); }
    },0);
    return;
  }
  const items = state.cart.map(i=>{
    const p = state.products.find(x=>x.id===i.productId);
    return {productId:p.id, name:p.name, emoji:p.emoji, image:pMainImage(p), qty:i.qty, price:p.price};
  });
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  const now = new Date();
  const order = {
    id: uid('ord'), ref: 'NV' + Math.floor(10000+Math.random()*89999),
    userId: u.id, userName: u.fullName, userEmail: u.email,
    shippingPhone: u.phone, shippingAddress: u.address, shippingCity: u.city,
    items, total, status:'en_attente', date: now.toISOString().slice(0,10),
    time: now.toTimeString().slice(0,5)
  };
  state.orders.unshift(order);
  await persistOrders();
  state.cart = [];
  await persistCart();
  updateHeader();
  showToast('Commande #' + order.ref + ' enregistrée !');
  goTo('account');
}

function orderCardHTML(order){

    <div class="order-foot"><span>${order.items.reduce((s,i)=>s+i.qty,0)} article(s)</span><span>${money(order.total)}</span></div>

function renderAffiliatePanel(u, myAff){
  const el = document.getElementById('affPanel');
  if(!el) return;
  if(!myAff){
    el.innerHTML = `
      <p style="color:var(--text-soft);font-size:14px;max-width:480px;">Rejoignez le programme d'affiliation NOVAGO et touchez une commission sur chaque vente générée grâce à votre lien.</p>
      <button class="btn btn-primary" id="applyAffBtn">Demander à devenir affilié</button>`;
    document.getElementById('applyAffBtn').addEventListener('click', async ()=>{
      const req = {id:uid('aff'), userId:u.id, userName:u.fullName, email:u.email, status:'en_attente', commissionRate:10, code:'', date:new Date().toISOString().slice(0,10)};
      state.affiliates.push(req);
      await persistAffiliates();
      showToast("Demande envoyée — en attente de validation par l'administrateur");
      renderAccount();
    });
  } else if(myAff.status==='en_attente'){
    el.innerHTML = `<div class="empty-note">Votre demande d'affiliation est en attente de validation par l'administrateur.</div>`;
  } else if(myAff.status==='refuse'){
    el.innerHTML = `<div class="empty-note">Votre demande d'affiliation a été refusée.</div>`;
  } else {
    el.innerHTML = `
      <div class="aff-code-box">
        <div><div style="font-size:12.5px;color:var(--text-soft);margin-bottom:4px;">Votre code affilié</div><div class="aff-code">${myAff.code}</div></div>
        <div style="text-align:right;"><div style="font-size:12.5px;color:var(--text-soft);">Commission</div><b style="font-size:20px;">${myAff.commissionRate}%</b></div>
      </div>
      <div class="panel-box" style="margin-top:16px;">
        <h3 style="margin:0 0 6px;font-size:15px;">Code d'affiliation par produit</h3>
        <p style="color:var(--text-soft);font-size:13px;margin:0 0 14px;">Utilisez le code ou le lien spécifique à chaque produit pour toucher votre commission dessus.</p>
        <table class="data-table"><thead><tr><th>Produit</th><th>Code produit</th><th>Lien à partager</th></tr></thead>
        <tbody>${state.products.map(p=>{
          const code = affiliateProductCode(myAff, p);
          const link = affiliateProductLink(myAff, p);
          return `<tr>
            <td>${pMainImage(p)?`<img src="${pMainImage(p)}" style="width:30px;height:30px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px;">`:`<span style="margin-right:6px;">${p.emoji}</span>`}${p.name}</td>
            <td style="font-family:'Poppins';font-weight:800;font-size:12.5px;">${code}</td>
            <td><button class="btn-sm btn-outline" data-copylink="${link}">Copier le lien</button></td>
          </tr>`;
        }).join('')}</tbody></table>
      </div>`;
    el.querySelectorAll('[data-copylink]').forEach(b=>b.addEventListener('click', ()=>{
      const link = b.dataset.copylink;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(link).then(()=>showToast('Lien copié !')).catch(()=>showToast(link));
      } else { showToast(link); }
    }));
  }
}
function affiliateProductCode(aff, product){ return aff.code + '-' + product.id; }
function affiliateProductLink(aff, product){
  return location.origin + location.pathname + '#product=' + product.id + '&ref=' + aff.code;
}

  document.getElementById('panel-products').innerHTML = `
    <div class="panel-box" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <h3 style="margin:0;">Tous les produits (${state.products.length})</h3>
      <button class="btn btn-primary btn-sm" id="newProductBtn">+ Ajouter un produit</button>
    </div>
    <div class="panel-box">
      <table class="data-table"><thead><tr><th>Photo</th><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Photos</th><th>Actions</th></tr></thead>
      <tbody>${state.products.map(p=>{
        const img = pMainImage(p);
        return `<tr>
        <td>${img?`<img src="${img}" style="width:38px;height:38px;object-fit:cover;border-radius:8px;">`:`<span style="font-size:22px;">${p.emoji}</span>`}</td>
        <td style="cursor:pointer;font-weight:700;" data-openprod="${p.id}">${p.name}</td>
        <td>${catOf(p.cat).label}</td><td>${money(p.price)}</td><td>${p.stock}</td>
        <td>${pImages(p).length}</td>
        <td class="act-btns"><button class="btn-sm btn-outline" data-editprod="${p.id}">Voir la fiche</button><button class="btn-sm btn-danger" data-delprod="${p.id}">Supprimer</button></td>
      </tr>`;}).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--text-soft);">Aucun produit.</td></tr>`}</tbody></table>
    </div>`;

  document.getElementById('newProductBtn').addEventListener('click', ()=>{
    state.editingProductId = null;
    state.productPhotosDraft = [];
    state.adminProductView = 'form';
    renderAdminProducts();
  });
  document.querySelectorAll('[data-delprod]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Supprimer ce produit ?')) return;
    state.products = state.products.filter(p=>p.id!=b.dataset.delprod);
    await persistProducts();
    renderAdminProducts();
  }));
  document.querySelectorAll('[data-editprod],[data-openprod]').forEach(b=>b.addEventListener('click', ()=>{
    const id = Number(b.dataset.editprod || b.dataset.openprod);
    const p = state.products.find(x=>x.id===id);
    state.editingProductId = id;
    state.productPhotosDraft = p ? pImages(p).slice() : [];
    state.adminProductView = 'form';
    renderAdminProducts();
  }));
}

function renderAdminProductForm(){
  const editing = state.editingProductId ? state.products.find(p=>p.id===state.editingProductId) : null;

  document.getElementById('panel-products').innerHTML = `
    <div class="back-link" id="backToList">← Retour à la liste des produits</div>
    <div class="panel-box">
      <h3>${editing ? 'Fiche produit — ' + editing.name : 'Nouveau produit'}</h3>
      <form id="productForm">
        <div class="admin-form-grid">
          <input id="npName" placeholder="Nom du produit" value="${editing?editing.name:''}" required>
          <select id="npCat">${CATS.map(c=>`<option value="${c.id}" ${editing&&editing.cat===c.id?'selected':''}>${c.label}</option>`).join('')}</select>
          <input id="npPrice" type="number" placeholder="Prix (MAD)" value="${editing?editing.price:''}" required>
          <input id="npOldPrice" type="number" placeholder="Ancien prix (optionnel)" value="${editing&&editing.oldPrice?editing.oldPrice:''}">
          <input id="npStock" type="number" placeholder="Stock" value="${editing?editing.stock:''}" required>
          <input id="npEmoji" placeholder="Emoji (repli si aucune photo)" maxlength="4" value="${editing?editing.emoji:''}">
        </div>
        <div class="form-row" style="margin-bottom:14px;">
          <label>Photos du produit</label>
          <input type="file" id="npPhotos" accept="image/*" multiple onchange="handleProductPhotosChange(this)">
          <div class="hint">Vous pouvez sélectionner plusieurs photos à la fois. La première photo est utilisée comme photo principale — glissez-déposez l'ordre n'est pas requis, la 1ère ajoutée est la principale.</div>
          <div id="photoDraftWrap" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;"></div>
        </div>
        <textarea id="npDesc" placeholder="Description" style="width:100%;padding:10px 12px;border:1.5px solid var(--grey-line);border-radius:8px;margin-bottom:12px;font-family:inherit;" rows="3">${editing?editing.desc:''}</textarea>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary btn-sm" type="submit">${editing ? 'Enregistrer les modifications' : 'Créer le produit'}</button>
          <button type="button" class="btn btn-outline btn-sm" id="cancelProdForm">Annuler</button>
        </div>
      </form>
    </div>`;

  renderPhotoDraftPreview();

  document.getElementById('backToList').addEventListener('click', ()=>{ state.adminProductView='list'; renderAdminProducts(); });
  document.getElementById('cancelProdForm').addEventListener('click', ()=>{ state.adminProductView='list'; renderAdminProducts(); });

  document.getElementById('productForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('npName').value.trim();
    const cat = document.getElementById('npCat').value;
    const price = Number(document.getElementById('npPrice').value)||0;
    const oldPrice = Number(document.getElementById('npOldPrice').value)||0;
    const stock = Number(document.getElementById('npStock').value)||0;
    const emoji = document.getElementById('npEmoji').value.trim() || '📦';
    const desc = document.getElementById('npDesc').value.trim() || 'Description à venir.';
    const images = state.productPhotosDraft.slice();

    if(editing){
      Object.assign(editing, {name, cat, price, oldPrice, stock, emoji, desc, images});
      delete editing.image;
      showToast('Produit mis à jour');
    } else {
      state.products.push({ id: Math.max(0,...state.products.map(p=>p.id))+1, name, cat, price, oldPrice, stock, emoji, desc, images });
      showToast('Produit créé');
    }
    await persistProducts();
    state.adminProductView = 'list';
    state.editingProductId = null;
    state.productPhotosDraft = [];
    renderAdminProducts();
  });
}

function renderAdminOrders(){
  document.getElementById('panel-orders').innerHTML = `
    <div class="panel-box">
      <h3>Toutes les commandes (${state.orders.length})</h3>
      <table class="data-table"><thead><tr><th>Réf.</th><th>Client</th><th>Date</th><th>Heure</th><th>Articles</th><th>Total</th><th>Statut</th><th>Actions</th></tr></thead>
      <tbody>${state.orders.map(o=>`<tr>
        <td>#${o.ref}</td><td>${o.userName}</td><td>${o.date}</td><td>${o.time||'—'}</td><td>${o.items.reduce((s,i)=>s+i.qty,0)}</td><td>${money(o.total)}</td>
        <td><span class="status ${o.status}">${o.status}</span></td>
        <td class="act-btns">
          <button class="btn-sm btn-outline" data-vieworder="${o.id}">Détails</button>
          <button class="btn-sm btn-green" data-confirm="${o.id}" ${o.status==='confirmee'?'disabled':''}>Confirmer</button>
          <button class="btn-sm btn-danger" data-cancel="${o.id}" ${o.status==='annulee'?'disabled':''}>Annuler</button>
          <button class="btn-sm btn-outline" data-delorder="${o.id}">Suppr.</button>
        </td>
      </tr>`).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--text-soft);">Aucune commande.</td></tr>`}</tbody></table>
    </div>`;
  document.querySelectorAll('[data-vieworder]').forEach(b=>b.addEventListener('click', ()=>{
    goAdminOrderDetail(b.dataset.vieworder);
  }));
  document.querySelectorAll('[data-confirm]').forEach(b=>b.addEventListener('click', async ()=>{
    const o = state.orders.find(x=>x.id===b.dataset.confirm); o.status='confirmee';
    await persistOrders(); showToast('Commande confirmée'); renderAdminOrders();
  }));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click', async ()=>{
    const o = state.orders.find(x=>x.id===b.dataset.cancel); o.status='annulee';
    await persistOrders(); showToast('Commande annulée'); renderAdminOrders();
  }));
  document.querySelectorAll('[data-delorder]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Supprimer cette commande ?')) return;
    state.orders = state.orders.filter(o=>o.id!==b.dataset.delorder);
    await persistOrders(); renderAdminOrders();
  }));
}

/* ---- Page dédiée : détail d'une commande ---- */
function goAdminOrderDetail(orderId){
  document.querySelectorAll('.admin-link[data-tab]').forEach(a=>a.classList.toggle('active', a.dataset.tab==='orders'));
  document.querySelectorAll('.admin-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-order-detail').classList.add('active');
  renderAdminOrderDetail(orderId);
}
function renderAdminOrderDetail(orderId){
  const o = state.orders.find(x=>x.id===orderId);
  const panel = document.getElementById('panel-order-detail');
  if(!o){ panel.innerHTML = `<div class="panel-box">Commande introuvable.</div>`; return; }
  const labels = {en_attente:'En attente', confirmee:'Confirmée', annulee:'Annulée'};
  const u = state.users.find(x=>x.id===o.userId);
  document.getElementById('adminTitle').textContent = 'Commande #' + o.ref;
  const hasAddress = o.shippingAddress || (u && u.address);
  const addr = o.shippingAddress || (u ? u.address : '') || '—';
  const city = o.shippingCity || (u ? u.city : '') || '';
  const phone = o.shippingPhone || (u ? u.phone : '') || '—';
  panel.innerHTML = `
    <a onclick="goAdminTab('orders')" style="display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--text-soft);cursor:pointer;margin-bottom:16px;">← Retour aux commandes</a>
    <div class="panel-box">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
        <div>
          <h3 style="margin:0;">Commande #${o.ref}</h3>
          <div style="color:var(--text-soft);font-size:13px;margin-top:4px;">Passée le ${o.date}${o.time?' à '+o.time:''}</div>
        </div>
        <span class="status ${o.status}" style="font-size:13px;padding:6px 16px;">${labels[o.status]}</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div class="panel-box">
        <h3>Client</h3>
        <div style="font-size:14px;line-height:2;">
          <div><b>Nom :</b> ${o.userName}</div>
          <div><b>E-mail :</b> ${o.userEmail}</div>
          <div><b>Téléphone :</b> ${phone}</div>
        </div>
      </div>
      <div class="panel-box">
        <h3>Adresse de livraison</h3>
        ${hasAddress ? `<div style="font-size:14px;line-height:2;">
          <div>${addr}</div>
          <div>${city}</div>
        </div>` : `<div class="empty-note" style="color:var(--red);">Aucune adresse de livraison renseignée par ce client.</div>`}
      </div>
    </div>

    <div class="panel-box">
      <h3>Articles commandés</h3>
      <table class="data-table"><thead><tr><th></th><th>Produit</th><th>Prix unitaire</th><th>Qté</th><th>Sous-total</th></tr></thead>
      <tbody>${o.items.map(it=>`<tr>
        <td>${it.image?`<img src="${it.image}" style="width:38px;height:38px;border-radius:8px;object-fit:cover;">`:`<span style="font-size:24px;">${it.emoji||''}</span>`}</td>
        <td>${it.name}</td><td>${money(it.price)}</td><td>${it.qty}</td><td>${money(it.price*it.qty)}</td>
      </tr>`).join('')}</tbody></table>
      <div style="display:flex;justify-content:flex-end;margin-top:14px;font-size:16px;font-weight:800;">Total : ${money(o.total)}</div>
    </div>

    <div class="panel-box" style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-green" id="detConfirm" ${o.status==='confirmee'?'disabled':''}>Confirmer la commande</button>
      <button class="btn btn-danger" id="detCancel" ${o.status==='annulee'?'disabled':''}>Annuler la commande</button>
      <button class="btn btn-outline" id="detDelete">Supprimer la commande</button>
    </div>`;
  document.getElementById('detConfirm').onclick = async ()=>{
    o.status='confirmee'; await persistOrders(); showToast('Commande confirmée'); renderAdminOrderDetail(orderId);
  };
  document.getElementById('detCancel').onclick = async ()=>{
    o.status='annulee'; await persistOrders(); showToast('Commande annulée'); renderAdminOrderDetail(orderId);
  };
  document.getElementById('detDelete').onclick = async ()=>{
    if(!confirm('Supprimer cette commande ?')) return;
    state.orders = state.orders.filter(x=>x.id!==orderId);
    await persistOrders(); showToast('Commande supprimée'); goAdminTab('orders');
  };
}

function renderAdminAffiliates(){
  document.getElementById('panel-affiliates').innerHTML = `
    <div class="panel-box">
      <h3>Demandes et affiliés (${state.affiliates.length})</h3>
      <table class="data-table"><thead><tr><th>Nom</th><th>E-mail</th><th>Statut</th><th>Commission</th><th>Code</th><th>Actions</th></tr></thead>
      <tbody>${state.affiliates.map(a=>`<tr>
        <td>${a.userName}</td><td>${a.email}</td>
        <td><span class="status ${a.status==='actif'?'confirmee':a.status==='refuse'?'annulee':'en_attente'}">${a.status}</span></td>
        <td>${a.commissionRate}%</td><td>${a.code||'—'}</td>
        <td class="act-btns">
          <button class="btn-sm btn-green" data-approveaff="${a.id}" ${a.status==='actif'?'disabled':''}>Approuver</button>
          <button class="btn-sm btn-danger" data-rejectaff="${a.id}" ${a.status==='refuse'?'disabled':''}>Rejeter</button>
          <button class="btn-sm btn-outline" data-editaff="${a.id}">Commission</button>
          <button class="btn-sm btn-outline" data-delaff="${a.id}">Suppr.</button>
        </td>
      </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--text-soft);">Aucune demande.</td></tr>`}</tbody></table>
    </div>`;
  document.querySelectorAll('[data-approveaff]').forEach(b=>b.addEventListener('click', async ()=>{
    const a = state.affiliates.find(x=>x.id===b.dataset.approveaff);
    a.status='actif'; if(!a.code) a.code = 'NOVA-' + a.userName.split(' ')[0].toUpperCase().slice(0,4) + Math.floor(1000+Math.random()*9000);
    await persistAffiliates(); showToast('Affilié approuvé'); renderAdminAffiliates();
  }));
  document.querySelectorAll('[data-rejectaff]').forEach(b=>b.addEventListener('click', async ()=>{
    const a = state.affiliates.find(x=>x.id===b.dataset.rejectaff); a.status='refuse';
    await persistAffiliates(); showToast('Demande refusée'); renderAdminAffiliates();
  }));
  document.querySelectorAll('[data-editaff]').forEach(b=>b.addEventListener('click', async ()=>{
    const a = state.affiliates.find(x=>x.id===b.dataset.editaff);
    const rate = prompt('Taux de commission (%)', a.commissionRate); if(rate===null) return;
    a.commissionRate = Number(rate)||a.commissionRate;
    await persistAffiliates(); showToast('Commission mise à jour'); renderAdminAffiliates();
  }));
  document.querySelectorAll('[data-delaff]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Supprimer cette entrée ?')) return;
    state.affiliates = state.affiliates.filter(a=>a.id!==b.dataset.delaff);
    await persistAffiliates(); renderAdminAffiliates();
  }));
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await seedIfNeeded();
  if(state.adminSession){ goAdmin(); }
  else { goTo('home'); }
})();
</script>
</body>
</html>
